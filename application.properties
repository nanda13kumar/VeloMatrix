# VeloMatrix — runtime ports (single source of truth)
# Use this file to choose ports for local dev, Docker host mapping, and CORS defaults.
# Keys are optional: if missing or blank, the built-in default is used.
#
# backend.port   — FastAPI / Uvicorn (default 8000)
# frontend.port — Vite dev server + default CORS origins (default 3000)
#
# Optional: comma-separated extra CORS origins (e.g. http://192.168.1.10:5173)
# cors.extra.origins=
#
# Docker / CI: set env APPLICATION_PROPERTIES=/absolute/path/to/application.properties

backend.port=8500
frontend.port=3500
