services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8500}:${BACKEND_PORT:-8500}"
    environment:
      - APPLICATION_PROPERTIES=/app/application.properties
      - DATABASE_URL=${DATABASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VELOMATRIX_ADMIN_API_KEY=${VELOMATRIX_ADMIN_API_KEY:-}
      - VELOMATRIX_DATA_BASE=/app/local/demo-data
      # Connector env vars — only used when bindings reference them
      - LOKI_BASE_URL=${LOKI_BASE_URL:-}
      - LOKI_BEARER_TOKEN=${LOKI_BEARER_TOKEN:-}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-}
      - PROMETHEUS_BEARER_TOKEN=${PROMETHEUS_BEARER_TOKEN:-}
      - SONARQUBE_URL=${SONARQUBE_URL:-}
      - SONARQUBE_TOKEN=${SONARQUBE_TOKEN:-}
      - SNYK_TOKEN=${SNYK_TOKEN:-}
      - SNYK_ORG_ID=${SNYK_ORG_ID:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - TRIVY_REPORT_PATH=${TRIVY_REPORT_PATH:-}
    volumes:
      - ./application.properties:/app/application.properties:ro
      - ./backend/src:/app/src:ro
      # Uncomment to override the baked-in demo data with your own catalog + bindings:
      # - ./local:/app/local:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${BACKEND_PORT:-8500}/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3500}:80"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8500}
    depends_on:
      backend:
        condition: service_healthy
